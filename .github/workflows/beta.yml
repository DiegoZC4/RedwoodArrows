name: Build and release Android app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install fixed SDK tools
        run: sdkmanager 'platforms;android-34' 'build-tools;36.1.0'
      - name: Sync integration tests (invented data only)
        run: |
          python3 -m venv .venv-test
          .venv-test/bin/pip install 'Pillow==11.3.0'
          REDWOOD_PYTHON=.venv-test/bin/python bash tools/test_sync.sh
      - name: Build with private signing key
        env:
          REDWOOD_KEYSTORE_BASE64: ${{ secrets.REDWOOD_KEYSTORE_BASE64 }}
          REDWOOD_STORE_PASSWORD: ${{ secrets.REDWOOD_STORE_PASSWORD }}
          REDWOOD_KEY_PASSWORD: ${{ secrets.REDWOOD_KEY_PASSWORD }}
          REDWOOD_KEY_ALIAS: ${{ secrets.REDWOOD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          signing_dir=$(mktemp -d)
          trap 'rm -f "$signing_dir/release.p12"; rmdir "$signing_dir"' EXIT
          printf '%s' "$REDWOOD_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.p12"
          chmod 600 "$signing_dir/release.p12"
          export REDWOOD_KEYSTORE="$signing_dir/release.p12"
          bash tools/build_beta.sh
          python3 - <<'PY'
          import os, subprocess
          tool=os.path.join(os.environ['ANDROID_HOME'],'build-tools/36.1.0/apksigner')
          result=subprocess.check_output([tool,'verify','--print-certs','build/beta/RedwoodArrows.apk'],text=True)
          expected='9e25bd67646760cbff2ee26d6ca36b4a106b095e16230482e37343c481e47df6'
          assert 'certificate SHA-256 digest: '+expected in result, 'Update signing identity changed; refusing release'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RedwoodArrows
          path: build/beta/RedwoodArrows.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish stable download for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("AndroidManifest.xml").getroot().get("{http://schemas.android.com/apk/res/android}versionName").split("-")[0])')
          test "$GITHUB_REF_NAME" = "v$version"
          (cd build/beta && sha256sum RedwoodArrows.apk > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" build/beta/RedwoodArrows.apk build/beta/SHA256SUMS.txt --title "Redwood Arrows $version" --notes "Experimental Android app. Install over your existing app; do not uninstall. Your sign-in and saved groupings stay in place. See UPDATING.md for the permanent download instructions." --latest
