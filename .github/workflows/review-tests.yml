name: Reviewed library checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sync-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install fixed SDK and isolated test dependencies
        run: |
          sdkmanager 'platforms;android-34'
          python3 -m venv .venv-test
          .venv-test/bin/pip install 'Pillow==11.3.0'
      - name: Original and Reviewed two-phone integration
        run: REDWOOD_PYTHON=.venv-test/bin/python bash tools/test_sync.sh
      - name: Compile complete app and check Reviewed routing
        run: REDWOOD_PYTHON=.venv-test/bin/python bash tools/validate_review.sh
